name: Fork Release

# Build per-platform `warp-oss` artifacts for the ATERCATES/warp fork and
# attach them to a GitHub Release.
#
# Trigger via:
#   - workflow_dispatch (manual)
#   - push of a `fork-v*` tag (e.g. `fork-v0.1.0`)
#
# Outputs uploaded to the matching Release:
#   - WarpOss-x86_64-apple-darwin.zip                  (Intel Mac)
#   - WarpOss-x86_64-linux.AppImage                    (Linux x86_64, AppImage)
#   - warp-terminal-oss_<version>_amd64.deb            (Linux x86_64, Debian/Ubuntu)
#
# No Apple signing, no notarization, no GCS upload, no Sentry. Everything runs
# with the default `secrets.GITHUB_TOKEN`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. fork-v0.1.0). Required for manual runs.
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as prerelease.
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'fork-v*'

permissions:
  contents: write

env:
  # GitHub-hosted runners don't ship FUSE; tell every AppImage we invoke
  # (linuxdeploy, the AppImage we produce ourselves) to extract itself to a
  # temp dir and run from there instead of trying to mount via FUSE. Mirrors
  # the upstream `release_linux_x86` job in the deleted `create_release.yml`.
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS x86_64
            os: macos-15
            target_os: macos
            arch: x86_64
            rust_target: x86_64-apple-darwin
          - label: Linux x86_64
            os: ubuntu-22.04
            target_os: linux
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      # `script/linux/bundle_deb` derives the package version from this. If
      # unset, the .deb file name comes out malformed (`pkg__amd64.deb`).
      # Drop the leading "fork-v" to match Debian's preferred version style.
      GIT_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: ${{ matrix.target_os }}
          is_self_hosted: 'false'
          install_release_deps: 'true'

      - name: Add Rust target (macOS)
        if: matrix.target_os == 'macos'
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install cargo-bundle (macOS)
        # `script/install_cargo_release_deps` only installs cargo-about. The
        # bundler comes from a separate script that fetches a cached binary;
        # fall back to building from source if the cache binary fails to
        # execute under the host arch.
        if: matrix.target_os == 'macos'
        run: ./script/install_cargo_bundle || cargo install --locked cargo-bundle

      - name: Install create-dmg (macOS)
        # script/macos/bundle always invokes `create-dmg` for ARTIFACT=app,
        # even when codesigning is skipped (lines 760-790 of script/macos/bundle).
        # Without this, the bundle step exits at the DMG creation phase.
        if: matrix.target_os == 'macos'
        run: brew install create-dmg

      - name: Install linuxdeploy (Linux)
        # script/linux/bundle_appimage shells out to `linuxdeploy` directly.
        # The repo's install_linuxdeploy script drops the AppImage tool into
        # ~/.local/bin; add that to GITHUB_PATH so the bundle script finds it.
        if: matrix.target_os == 'linux'
        run: |
          ./script/linux/install_linuxdeploy
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Build OSS bundle
        run: |
          if [[ "${{ matrix.target_os }}" == "macos" ]]; then
            # `--nosign` flips CODESIGN=false explicitly; DMG is still created
            # (unsigned) and we pick up the `.app` for zip distribution.
            ./script/bundle --channel oss --arch ${{ matrix.arch }} --nosign
          else
            BUILD_ARCH=${{ matrix.arch }} ./script/bundle --channel oss --packages appimage,deb
          fi

      - name: Package macOS .app as zip
        if: matrix.target_os == 'macos'
        run: |
          BUNDLE_DIR=target/${{ matrix.rust_target }}/release-lto/bundle/osx
          if [[ ! -d "$BUNDLE_DIR/WarpOss.app" ]]; then
            echo "Expected $BUNDLE_DIR/WarpOss.app to exist; found:" >&2
            ls -la "$BUNDLE_DIR" >&2 || true
            exit 1
          fi
          ditto -c -k --keepParent "$BUNDLE_DIR/WarpOss.app" "WarpOss-${{ matrix.arch }}-apple-darwin.zip"

      - name: Locate Linux artifacts
        if: matrix.target_os == 'linux'
        run: |
          OUT_DIR=target/release-lto/bundle/linux
          APPIMAGE=$(ls "$OUT_DIR"/WarpOss-*.AppImage | head -1)
          DEB=$(ls "$OUT_DIR"/warp-terminal-oss_*_amd64.deb | head -1)
          for f in "$APPIMAGE" "$DEB"; do
            if [[ -z "$f" || ! -f "$f" ]]; then
              echo "Missing expected artifact in $OUT_DIR" >&2
              ls -la "$OUT_DIR" >&2 || true
              exit 1
            fi
          done
          cp "$APPIMAGE" "WarpOss-${{ matrix.arch }}-linux.AppImage"
          cp "$DEB"      "$(basename "$DEB")"
          chmod +x "WarpOss-${{ matrix.arch }}-linux.AppImage"

      - name: Compute artifact checksums
        run: |
          if [[ "${{ matrix.target_os }}" == "macos" ]]; then
            FILES=(WarpOss-${{ matrix.arch }}-apple-darwin.zip)
          else
            FILES=(WarpOss-${{ matrix.arch }}-linux.AppImage warp-terminal-oss_*_amd64.deb)
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "${FILES[@]}" > checksums.sha256
          else
            shasum -a 256 "${FILES[@]}" > checksums.sha256
          fi
          cat checksums.sha256

      - name: Upload artifacts (macOS)
        if: matrix.target_os == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target_os }}-${{ matrix.arch }}
          path: |
            WarpOss-${{ matrix.arch }}-apple-darwin.zip
            checksums.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload artifacts (Linux)
        if: matrix.target_os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target_os }}-${{ matrix.arch }}
          path: |
            WarpOss-${{ matrix.arch }}-linux.AppImage
            warp-terminal-oss_*_amd64.deb
            checksums.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact layout
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name 'checksums.sha256' \) -exec cp {} dist/ \;
          # Merge per-job checksums into one file, then drop the per-job copies.
          if compgen -G 'artifacts/*/checksums.sha256' >/dev/null; then
            cat artifacts/*/checksums.sha256 > dist/checksums.sha256
          fi
          ls -la dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*
          body: |
            Fork build of `warp-oss` from ATERCATES/warp.

            ## Install

            ```sh
            curl -sSf https://raw.githubusercontent.com/ATERCATES/warp/master/scripts/install.sh | bash
            ```

            The installer detects your OS / arch, picks the right artifact (.deb when `dpkg` is available, otherwise the AppImage on Linux), downloads from this release, and installs it.

            ## Manual install

            - **macOS Intel**: download `WarpOss-x86_64-apple-darwin.zip`, unzip into `~/Applications`, then bypass Gatekeeper on first launch:
              ```sh
              xattr -dr com.apple.quarantine ~/Applications/WarpOss.app
              ```
            - **Debian / Ubuntu**: `sudo apt install ./warp-terminal-oss_*_amd64.deb`
            - **Any Linux x86_64**: download `WarpOss-x86_64-linux.AppImage`, `chmod +x`, run.

            ## Notes

            - Unsigned macOS build. Gatekeeper requires the `xattr` bypass above on first launch.
            - No auto-update. Re-run the installer or download a newer release to upgrade.
            - Shares config with the official Warp at `~/.warp/`. Use `WARP_CONFIG_DIR=~/.warp-fork warp-oss` to isolate.
