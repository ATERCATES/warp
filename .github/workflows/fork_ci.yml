name: Fork CI

# Lightweight PR checks for ATERCATES/warp. The upstream `ci.yml` requires
# self-hosted Namespace runners + `TRUNK_API_TOKEN` neither of which the fork
# has access to, so we run a slim subset on GitHub-hosted runners.
#
# Adds:
#   - cargo fmt check
#   - cargo check on Linux (warp-oss + remote_sessions feature)
#
# Release artifacts are produced by `.github/workflows/fork_release.yml`.

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-22.04
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: cargo check (linux, warp-oss)
    runs-on: ubuntu-22.04
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: 'false'

      - name: cargo check
        run: cargo check --bin warp-oss --features warp/remote_sessions
